<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看看 SeeSee — UI 原型</title>
<style>
  :root{
    --canvas:#0F1114;
    --surface:rgba(27,30,35,.92);
    --border:#2A2F36;
    --text:#E8EAED;
    --text2:#9AA2AE;
    --text3:#6B7480;
    --accent:#5B9CFF;
    --hover:rgba(255,255,255,.08);
    --active:rgba(255,255,255,.14);
    --mono:"Cascadia Mono",Consolas,monospace;
    --shadow:0 8px 28px rgba(0,0,0,.55);
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 4%, #262e36 0%, rgba(38,46,54,0) 55%),
      linear-gradient(160deg,#1c2126 0%,#181d22 52%,#14181c 100%);
    font-family:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    font-size:12.5px;line-height:1.45;color:var(--text);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;cursor:default;
  }

  /* faint desktop vignette behind the window */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(78% 68% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 100%);
  }

  .sprite{position:absolute;width:0;height:0;overflow:hidden}
  .ic{display:block;width:16px;height:16px;flex:0 0 auto}

  /* ============ window ============ */
  .app{
    position:relative;z-index:1;
    width:1200px;height:780px;flex:0 0 auto;
    display:flex;flex-direction:column;
    background:var(--canvas);
    border:1px solid var(--border);border-radius:8px;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
    overflow:hidden;
    transform-origin:center center;
  }

  /* ============ title bar ============ */
  .titlebar{
    flex:0 0 34px;height:34px;
    display:flex;align-items:center;
    background:#16191E;border-bottom:1px solid var(--border);
    padding-left:12px;
  }
  .tb-left{display:flex;align-items:center;gap:8px;min-width:0}
  .logo{width:16px;height:16px;color:var(--accent);opacity:.95}
  .appname{font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--text)}
  .tb-dot{color:var(--text3);font-size:12px;line-height:1}
  .tb-file{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .winbtns{margin-left:auto;display:flex;height:100%}
  .winbtn{
    width:46px;height:33px;display:grid;place-items:center;
    border:0;background:transparent;color:var(--text2);cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .winbtn:hover{background:var(--hover);color:var(--text)}
  .winbtn:active{background:var(--active)}
  .winbtn.close:hover{background:#E81123;color:#fff}
  .winbtn.close:active{background:#C50F1F;color:#fff}

  /* ============ stage ============ */
  .stage{
    position:relative;flex:1 1 auto;min-height:0;
    display:grid;place-items:center;
    background:var(--canvas);
    overflow:hidden;
  }

  .photo{
    position:relative;
    width:880px;height:550px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:2px;
    overflow:hidden;
    box-shadow:0 20px 48px rgba(0,0,0,.5);
    transition:opacity .12s linear, transform .12s ease-out;
    will-change:opacity,transform;
  }
  .photo.switching{opacity:0;transform:translateX(var(--dx,-8px)) scale(.998)}
  .photo .art{display:block;width:100%;height:100%;transition:filter .22s ease}

  /* floating arrows */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.07);
    color:var(--text);
    cursor:pointer;opacity:.55;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .15s ease,opacity .15s ease,border-color .15s ease;
    z-index:3;
  }
  .nav:hover{background:rgba(0,0,0,.62);opacity:1;border-color:rgba(255,255,255,.16)}
  .nav:active{background:rgba(0,0,0,.75)}
  .nav.prev{left:16px}
  .nav.next{right:16px}

  /* info pill */
  .pill{
    position:absolute;
    display:flex;align-items:center;gap:7px;
    height:26px;padding:0 11px;
    border-radius:999px;
    background:var(--surface);border:1px solid var(--border);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    box-shadow:var(--shadow);
    color:var(--text2);font-size:11.5px;white-space:nowrap;
    z-index:4;
  }
  .pill .num{font-family:var(--mono);font-size:11px;letter-spacing:-.01em;color:var(--text2)}
  .pill .sep-dot{color:var(--text3)}

  .info{left:16px;bottom:14px}

  /* zoom pill */
  .zoomer{
    position:absolute;right:16px;bottom:14px;
    display:flex;align-items:center;gap:2px;
    height:30px;padding:0 5px;
    border-radius:999px;
    background:var(--surface);border:1px solid var(--border);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    box-shadow:var(--shadow);
    z-index:4;
  }
  .zbtn{
    width:24px;height:24px;display:grid;place-items:center;
    border:0;border-radius:999px;background:transparent;color:var(--text2);
    cursor:pointer;transition:background .12s ease,color .12s ease;
  }
  .zbtn:hover{background:var(--hover);color:var(--text)}
  .zbtn:active{background:var(--active)}
  .zbtn .ic{width:14px;height:14px}
  .zval{
    min-width:42px;text-align:center;
    font-family:var(--mono);font-size:11.5px;color:var(--text);
    letter-spacing:-.01em;
  }
  .zsep{width:1px;height:16px;background:var(--border);margin:0 3px;flex:0 0 auto}

  /* ============ toolbar ============ */
  .toolbar{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    height:44px;padding:0 8px;
    display:flex;align-items:center;gap:2px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    box-shadow:var(--shadow);
    z-index:5;
    transition:opacity .35s ease;
  }
  .stage.idle .toolbar{opacity:.12}

  .tbtn{
    width:32px;height:32px;display:grid;place-items:center;
    border:0;border-radius:8px;background:transparent;color:var(--text2);
    cursor:pointer;transition:background .12s ease,color .12s ease;
  }
  .tbtn:hover{background:var(--hover);color:var(--text)}
  .tbtn:active{background:var(--active)}
  .tbtn.on{color:var(--accent)}
  .tbtn.on:hover{color:var(--accent)}
  .tbtn .ic{width:16px;height:16px}

  .tsep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:0 0 auto}

  .zread{
    min-width:46px;text-align:center;
    font-family:var(--mono);font-size:11.5px;color:var(--text2);
    letter-spacing:-.01em;
  }

  /* ============ filmstrip ============ */
  .strip{
    position:relative;flex:0 0 44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:#12151A;border-top:1px solid var(--border);
    z-index:6;
  }
  .thumbs{
    display:flex;align-items:center;gap:6px;
    padding:0 24px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
  }
  .thumb{
    position:relative;width:36px;height:36px;flex:0 0 auto;
    border-radius:6px;overflow:hidden;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
    transition:box-shadow .15s ease,filter .15s ease,transform .15s ease;
  }
  .thumb::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 45%,rgba(0,0,0,.22));
    opacity:.9;
  }
  .thumb:hover{filter:brightness(1.2);transform:translateY(-1px)}
  .thumb.active{
    box-shadow:0 0 0 2px var(--accent),0 0 14px rgba(91,156,255,.45);
  }
  .thumb.active::after{opacity:.35}

  /* ============ settings panel ============ */
  .panel{
    position:absolute;top:34px;right:0;bottom:0;width:340px;
    display:flex;flex-direction:column;
    background:var(--surface);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-left:1px solid var(--border);
    box-shadow:-18px 0 48px rgba(0,0,0,.5);
    transform:translateX(102%);opacity:0;pointer-events:none;
    transition:transform .22s var(--ease),opacity .22s var(--ease);
    z-index:20;
  }
  .app.panel-open .panel{transform:translateX(0);opacity:1;pointer-events:auto}

  .panel-head{
    flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;
    padding:0 12px 0 18px;border-bottom:1px solid var(--border);
  }
  .panel-head h2{font-size:13px;font-weight:500;letter-spacing:.01em}
  .iconbtn{
    width:28px;height:28px;display:grid;place-items:center;
    border:0;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .iconbtn:hover{background:var(--hover);color:var(--text)}
  .iconbtn:active{background:var(--active)}

  .panel-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding-bottom:14px}
  .panel-body::-webkit-scrollbar{width:0;height:0}
  .panel-body{scrollbar-width:none}

  .sec{padding:16px 18px 18px;border-bottom:1px solid rgba(42,47,54,.7)}
  .sec:last-child{border-bottom:0}
  .sec h3{
    font-size:12.5px;font-weight:500;color:var(--text);
    letter-spacing:.02em;margin-bottom:10px;
  }
  .sec h3 .tag{
    margin-left:6px;font-size:10.5px;font-weight:400;color:var(--text3);
    font-family:var(--mono);letter-spacing:0;
  }
  .hint{
    font-size:11.5px;line-height:1.6;color:var(--text3);
    margin-bottom:12px;
  }

  .btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;height:34px;border-radius:8px;
    font-family:inherit;font-size:12.5px;cursor:pointer;
    transition:background .13s ease,border-color .13s ease,color .13s ease,filter .13s ease;
  }
  .btn-primary{
    border:1px solid transparent;
    background:var(--accent);color:#0B1220;font-weight:500;
    box-shadow:0 4px 14px rgba(91,156,255,.28);
  }
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-primary:active{filter:brightness(.94)}
  .btn-ghost{
    margin-top:8px;border:1px solid var(--border);background:#1D2127;color:var(--text2);
  }
  .btn-ghost:hover{background:#22272E;color:var(--text);border-color:#343A43}
  .btn-ghost:active{background:var(--active)}

  .row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    min-height:34px;padding:5px 0;
  }
  .row + .row{margin-top:6px}
  .row .label{font-size:12.5px;color:var(--text2)}
  .row .sub{font-size:11px;color:var(--text3);margin-top:1px}

  /* steppers */
  .preload{display:flex;gap:6px}
  .pl{
    display:flex;align-items:center;gap:1px;
    height:28px;padding:0 4px 0 7px;
    background:#1B1E23;border:1px solid var(--border);border-radius:8px;
  }
  .pl-k{font-size:11px;color:var(--text3);margin-right:3px}
  .pl-v{
    min-width:15px;text-align:center;
    font-family:var(--mono);font-size:11.5px;color:var(--text);
  }
  .pl-b{
    width:18px;height:18px;display:grid;place-items:center;
    border:0;border-radius:5px;background:transparent;color:var(--text3);cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .pl-b:hover{background:var(--hover);color:var(--text)}
  .pl-b:active{background:var(--active)}

  /* segmented control */
  .seg{
    display:flex;gap:2px;padding:2px;
    background:#1B1E23;border:1px solid var(--border);border-radius:8px;
  }
  .segbtn{
    height:24px;padding:0 12px;border:0;border-radius:6px;background:transparent;
    font-family:inherit;font-size:11.5px;color:var(--text3);cursor:pointer;
    white-space:nowrap;transition:background .13s ease,color .13s ease;
  }
  .segbtn:hover{color:var(--text2);background:var(--hover)}
  .segbtn.on{
    background:rgba(255,255,255,.12);color:var(--text);
    box-shadow:0 1px 2px rgba(0,0,0,.35);
  }

  /* panel footer */
  .panel-foot{
    flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;border-top:1px solid var(--border);
    font-size:11px;color:var(--text3);
  }
  .panel-foot .v{font-family:var(--mono);font-size:10.5px;letter-spacing:-.01em}

  /* shortcut table */
  .keys{
    display:grid;grid-template-columns:1fr 1fr;
    gap:9px 14px;margin-top:2px;
  }
  .krow{display:flex;align-items:center;gap:6px;min-width:0}
  .kcap{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:20px;height:19px;padding:0 5px;
    background:#22262C;border:1px solid #333A43;border-radius:5px;
    font-family:var(--mono);font-size:10.5px;line-height:1;color:var(--text2);
    box-shadow:0 1px 0 rgba(0,0,0,.35);
    white-space:nowrap;
  }
  .kcap.wide{padding:0 6px}
  .kdesc{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* immersive (fullscreen) */
  .app.immersive .titlebar,
  .app.immersive .strip{display:none}
  .app.immersive .panel{top:0}
</style>
</head>

<div class="app" id="app">

  <!-- title bar -->
  <header class="titlebar">
    <div class="tb-left">

      <span class="appname">看看</span>
      <span class="tb-dot">·</span>
      <span class="tb-file" id="fileName">DSC_0421.jpg</span>

    <div class="winbtns">
      <button class="winbtn" type="button" title="最小化"><svg class="ic" aria-hidden="true"><use href="#i-min"/></svg></button>

      <button class="winbtn close" type="button" title="关闭"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
  </header>

  <!-- image stage -->
  <div class="stage" id="stage">

    <div class="photo" id="photo">
      <svg class="art" id="art" viewBox="0 0 880 550" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="skyG" x1="0" y1="0" x2="0.08" y2="1">
            <stop offset="0"    stop-color="#101A27"/>
            <stop offset="18%"  stop-color="#1B2838"/>
            <stop offset="36%"  stop-color="#31404F"/>
            <stop offset="50%"  stop-color="#5C5A5F"/>
            <stop offset="58%"  stop-color="#8E6F62"/>
            <stop offset="64%"  stop-color="#C08E6B"/>
            <stop offset="70%"  stop-color="#EBB584"/>
            <stop offset="76%"  stop-color="#F2C594"/>
            <stop offset="100%" stop-color="#DDAE81"/>
          </linearGradient>

          <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0"    stop-color="#FFF3D8" stop-opacity=".95"/>
            <stop offset="22%"  stop-color="#FFD9A2" stop-opacity=".7"/>
            <stop offset="48%"  stop-color="#FFB877" stop-opacity=".3"/>
            <stop offset="72%"  stop-color="#F79A5F" stop-opacity=".11"/>
            <stop offset="100%" stop-color="#EF8A52" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#FFD9A8" stop-opacity="0"/>
            <stop offset="55%" stop-color="#FFD2A0" stop-opacity=".38"/>
            <stop offset="100%" stop-color="#FFCF9C" stop-opacity="0"/>
          </linearGradient>

          <linearGradient id="vigG" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0"   stop-color="#000" stop-opacity=".28"/>
            <stop offset="26%" stop-color="#000" stop-opacity="0"/>
            <stop offset="74%" stop-color="#000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000" stop-opacity=".34"/>
          </linearGradient>

          <radialGradient id="vigR" cx="0.5" cy="0.44" r="0.72">
            <stop offset="52%"  stop-color="#000" stop-opacity="0"/>

<script>
(function () {
  "use strict";

  var FIT = 78;
  var MIN_Z = 10;
  var MAX_Z = 800;

  var app = document.getElementById("app");
  var stage = document.getElementById("stage");
  var photo = document.getElementById("photo");
  var art = document.getElementById("art");
  var fileName = document.getElementById("fileName");
  var infoDims = document.getElementById("infoDims");
  var infoSize = document.getElementById("infoSize");
  var zRead = document.getElementById("zRead");
  var zPillVal = document.getElementById("zPillVal");
  var thumbsBox = document.getElementById("thumbs");

  /* miniature landscape gradients for the filmstrip */
  function thumbBg(skyTop, skyLow, glow, ground) {
    return "radial-gradient(42% 34% at 56% 36%," + glow + " 0%,rgba(255,255,255,0) 74%)," +
      "linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 46%," +
      "rgba(0,0,0,.24) 47%,rgba(0,0,0,.24) 62%,rgba(0,0,0,.48) 63%,rgba(0,0,0,.48) 100%)," +
      "linear-gradient(180deg," + skyTop + " 0%," + skyLow + " 60%," +
      ground + " 61%," + ground + " 100%)";
  }

  var PHOTOS = [
    { name: "DSC_0421.jpg", dims: "3840 × 2560", size: "4.8 MB", filter: "none",
      css: thumbBg("#101826", "#c08a63", "rgba(255,214,168,.78)", "#0c1219") },
    { name: "DSC_0422.jpg", dims: "5472 × 3648", size: "11.2 MB", filter: "hue-rotate(-22deg) saturate(1.08)",
      css: thumbBg("#17101c", "#cc7a58", "rgba(255,180,130,.78)", "#120c11") },
    { name: "DSC_0423.jpg", dims: "3840 × 2560", size: "5.1 MB", filter: "hue-rotate(158deg) saturate(.95)",
      css: thumbBg("#0a1a22", "#5fc4b4", "rgba(160,255,235,.72)", "#081318") },
    { name: "DSC_0424.jpg", dims: "2400 × 1600", size: "2.6 MB", filter: "hue-rotate(48deg) saturate(1.05) brightness(1.03)",
      css: thumbBg("#111f13", "#b4cc84", "rgba(225,255,180,.68)", "#0b130d") },
    { name: "DSC_0425.jpg", dims: "6000 × 4000", size: "14.7 MB", filter: "saturate(.12) brightness(1.06)",
      css: thumbBg("#1b1f24", "#c2c9d1", "rgba(255,255,255,.66)", "#0d0f12") },
    { name: "DSC_0426.jpg", dims: "3840 × 2560", size: "4.3 MB", filter: "hue-rotate(-48deg) saturate(1.18)",
      css: thumbBg("#1e131f", "#dc9aa4", "rgba(255,215,225,.72)", "#130d16") },
    { name: "DSC_0427.jpg", dims: "4000 × 2667", size: "7.2 MB", filter: "hue-rotate(196deg) brightness(.96)",
      css: thumbBg("#141224", "#9c8ce8", "rgba(215,205,255,.72)", "#0d0a1a") },
    { name: "DSC_0428.jpg", dims: "3264 × 2448", size: "3.4 MB", filter: "sepia(.22) hue-rotate(-12deg) brightness(1.04)",
      css: thumbBg("#1e1a12", "#dcc08a", "rgba(255,235,195,.68)", "#14110b") },
    { name: "DSC_0429.jpg", dims: "3840 × 2560", size: "5.6 MB", filter: "hue-rotate(104deg) saturate(.88)",
      css: thumbBg("#0c1622", "#8ab8e8", "rgba(200,225,255,.72)", "#080f18") },
    { name: "DSC_0430.jpg", dims: "4608 × 3072", size: "8.9 MB", filter: "hue-rotate(-72deg) brightness(1.07)",
      css: thumbBg("#1c121c", "#e8a8c4", "rgba(255,215,235,.72)", "#130d14") }
  ];

  var idx = 0;
  var zoom = FIT;
  var switching = false;
  var rot = 0;

  /* ---------- filmstrip ---------- */
  PHOTOS.forEach(function (p, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "thumb";
    b.style.background = p.css;
    b.title = p.name;
    b.setAttribute("aria-label", p.name);
    b.addEventListener("click", function () { go(i, i > idx ? 1 : -1); });
    thumbsBox.appendChild(b);
  });
  var thumbEls = Array.prototype.slice.call(thumbsBox.children);

  /* ---------- apply current photo ---------- */
  function paint() {
    var p = PHOTOS[idx];
    fileName.textContent = p.name;
    infoDims.textContent = p.dims;
    infoSize.textContent = p.size;
    var f = p.filter === "none" ? "" : p.filter;
    if (rot) f = (f ? f + " " : "") + "rotate(" + rot + "deg)";
    art.style.filter = f;
    thumbEls.forEach(function (t, i) { t.classList.toggle("active", i === idx); });
  }

  /* ---------- paging ---------- */
  function go(n, dir) {
    if (switching) return;
    var next = ((n % PHOTOS.length) + PHOTOS.length) % PHOTOS.length;
    if (next === idx && !dir) return;
    switching = true;
    photo.style.setProperty("--dx", (dir < 0 ? 9 : -9) + "px");
    photo.classList.add("switching");
    window.setTimeout(function () {
      idx = next;
      paint();
      photo.classList.remove("switching");
      window.setTimeout(function () { switching = false; }, 130);
    }, 120);
  }

  /* ---------- zoom ---------- */
  function setZoom(v) {
    zoom = Math.max(MIN_Z, Math.min(MAX_Z, Math.round(v)));
    var label = zoom + "%";
    zRead.textContent = label;
    zPillVal.textContent = label;
  }

  function nudgeZoom(dir) {
    var v = dir > 0
      ? Math.floor(zoom / 5) * 5 + 5
      : Math.ceil(zoom / 5) * 5 - 5;
    setZoom(v);
  }

  /* ---------- wiring ---------- */
  document.getElementById("navPrev").addEventListener("click", function () { go(idx - 1, -1); });
  document.getElementById("navNext").addEventListener("click", function () { go(idx + 1, 1); });
  document.getElementById("tbPrev").addEventListener("click", function () { go(idx - 1, -1); });
  document.getElementById("tbNext").addEventListener("click", function () { go(idx + 1, 1); });

  document.getElementById("tbZoomOut").addEventListener("click", function () { nudgeZoom(-1); });
  document.getElementById("tbZoomIn").addEventListener("click", function () { nudgeZoom(1); });
  document.getElementById("zOut").addEventListener("click", function () { nudgeZoom(-1); });
  document.getElementById("zIn").addEventListener("click", function () { nudgeZoom(1); });

  document.getElementById("tbFit").addEventListener("click", function () { setZoom(FIT); });
  document.getElementById("zFit").addEventListener("click", function () { setZoom(FIT); });
  document.getElementById("tbActual").addEventListener("click", function () { setZoom(100); });

  function applyRotation() {
    var s = (rot % 180 === 90) ? 1.62 : 1;
    art.style.transition = "transform .22s cubic-bezier(.22,.61,.36,1)";
    art.style.transform = "rotate(" + rot + "deg) scale(" + s + ")";
  }
  document.getElementById("tbRotL").addEventListener("click", function () { rot = (rot + 270) % 360; applyRotation(); });
  document.getElementById("tbRotR").addEventListener("click", function () { rot = (rot + 90) % 360; applyRotation(); });

  document.getElementById("tbPlay").addEventListener("click", function () {
    this.classList.toggle("on");
  });

  document.getElementById("tbFull").addEventListener("click", function () {
    app.classList.toggle("immersive");
    this.classList.toggle("on", app.classList.contains("immersive"));
  });

  /* ---------- settings panel ---------- */
  var gear = document.getElementById("gear");

  function openPanel() {
    app.classList.add("panel-open");
    document.getElementById("panel").setAttribute("aria-hidden", "false");
    gear.classList.add("on");
  }
  function closePanel() {
    app.classList.remove("panel-open");
    document.getElementById("panel").setAttribute("aria-hidden", "true");
    gear.classList.remove("on");
  }
  function togglePanel() {
    if (app.classList.contains("panel-open")) closePanel(); else openPanel();
  }

  gear.addEventListener("click", function (e) { e.stopPropagation(); togglePanel(); });
  document.getElementById("panelClose").addEventListener("click", closePanel);

  document.addEventListener("click", function (e) {
    if (!app.classList.contains("panel-open")) return;
    if (e.target.closest(".panel") || e.target.closest("#gear")) return;
    closePanel();
  });

  /* steppers */
  Array.prototype.forEach.call(document.querySelectorAll(".pl-b"), function (b) {
    b.addEventListener("click", function () {
      var el = document.getElementById(b.getAttribute("data-target"));
      var v = parseInt(el.textContent, 10) + parseInt(b.getAttribute("data-step"), 10);
      el.textContent = Math.max(0, Math.min(9, v));
    });
  });

  /* segmented controls */
  Array.prototype.forEach.call(document.querySelectorAll("[data-seg]"), function (seg) {
    Array.prototype.forEach.call(seg.querySelectorAll(".segbtn"), function (btn) {
      btn.addEventListener("click", function () {
        Array.prototype.forEach.call(seg.querySelectorAll(".segbtn"), function (o) { o.classList.remove("on"); });
        btn.classList.add("on");
      });
    });
  });

  /* ---------- auto-dim toolbar while hovering the canvas ---------- */
  var idleTimer = null;
  var toolbarEl = document.querySelector(".toolbar");
  function wake() {
    stage.classList.remove("idle");
    if (idleTimer) window.clearTimeout(idleTimer);
    idleTimer = window.setTimeout(function () {
      /* never dim while the pointer rests on the bar itself */
      if (toolbarEl.matches(":hover")) { wake(); return; }
      stage.classList.add("idle");
    }, 2500);
  }
  stage.addEventListener("mousemove", wake);
  stage.addEventListener("mouseenter", wake);
  stage.addEventListener("mouseleave", function () {
    if (idleTimer) window.clearTimeout(idleTimer);
    stage.classList.remove("idle");
  });

  /* ---------- double click: fit <-> 100% ---------- */
  stage.addEventListener("dblclick", function (e) {
    if (e.target.closest("button")) return;
    setZoom(zoom === FIT ? 100 : FIT);
  });

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { go(idx - 1, -1); }
    else if (e.key === "ArrowRight") { go(idx + 1, 1); }
    else if (e.key === "Escape") { closePanel(); }
    else if (e.key === "+" || e.key === "=") { nudgeZoom(1); }
    else if (e.key === "-" || e.key === "_") { nudgeZoom(-1); }
  });

  /* ---------- fit the mockup into the review viewport ---------- */
  function fitScale() {
    var s = Math.min(1, (window.innerWidth - 72) / 1200, (window.innerHeight - 72) / 780);
    s = Math.max(0.3, s);
    app.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fitScale);

  /* ---------- init ---------- */
  paint();
  setZoom(FIT);
  fitScale();
})();
</script>
</body>
</html>
